
name: AURELIA Android Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'AURELIA_Phase21.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: aurelia-android-build
  cancel-in-progress: true

jobs:
  debug-build:
    name: Build AURELIA Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract AURELIA ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f AURELIA_Phase21.zip

          mkdir -p "$RUNNER_TEMP/aurelia-source"
          unzip -q AURELIA_Phase21.zip -d "$RUNNER_TEMP/aurelia-source"

          test -f "$RUNNER_TEMP/aurelia-source/aurelia_working_copy/settings.gradle.kts"
          test -f "$RUNNER_TEMP/aurelia-source/aurelia_working_copy/app/build.gradle.kts"

          echo "AURELIA_ROOT=$RUNNER_TEMP/aurelia-source/aurelia_working_copy" >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Detect Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"

          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager not found in $SDK"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          echo "Android SDK detected: $SDK"
          "$SDKMANAGER" --version

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install Gradle 9.3.1
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            https://services.gradle.org/distributions/gradle-9.3.1-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"

          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Build Environment
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-36"

      - name: Run Tests and Build APK
        working-directory: ${{ env.AURELIA_ROOT }}
        run: |
          gradle --no-daemon --stacktrace clean :app:testDebugUnitTest :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AURELIA-Debug-APK
          path: ${{ env.AURELIA_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AURELIA-Test-Reports
          path: ${{ env.AURELIA_ROOT }}/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
          
