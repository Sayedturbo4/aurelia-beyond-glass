
name: AURELIA Android Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'AURELIA_Integrated_WorkingCopy_Phase34_Fix2.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: aurelia-android-build
  cancel-in-progress: true

jobs:
  debug-build:
    name: Build AURELIA Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract AURELIA Phase 34 Fix 2 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="AURELIA_Integrated_WorkingCopy_Phase34_Fix2.zip"
          test -f "$ZIP_FILE"

          mkdir -p "$RUNNER_TEMP/aurelia-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/aurelia-source"

          AURELIA_ROOT="$(find "$RUNNER_TEMP/aurelia-source" -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"

          test -n "$AURELIA_ROOT"
          test -f "$AURELIA_ROOT/app/build.gradle.kts"

          echo "AURELIA_ROOT=$AURELIA_ROOT" >> "$GITHUB_ENV"
          echo "Project root: $AURELIA_ROOT"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"

          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found in $SDK"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --sdk_root="$SDK" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install Gradle 9.3.1
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            https://services.gradle.org/distributions/gradle-9.3.1-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"

          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Build Environment
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version

          echo "ANDROID_HOME=$ANDROID_HOME"

          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Run Phase 33 Source Checks
        working-directory: ${{ env.AURELIA_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f AURELIA_PHASE33_CHECKS.py ]; then
            python3 AURELIA_PHASE33_CHECKS.py
          else
            echo "Phase 33 check script not found; continuing."
          fi

      - name: Run Unit Tests and Build APK
        working-directory: ${{ env.AURELIA_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace clean \
            :app:compileDebugKotlin \
            :app:testDebugUnitTest \
            :app:assembleDebug

      - name: Generate APK Checksum and Build Info
        working-directory: ${{ env.AURELIA_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/debug \
            -maxdepth 1 -name '*.apk' -print -quit)"

          test -n "$APK"

          sha256sum "$APK" \
            > app/build/outputs/apk/debug/SHA256SUMS.txt

          printf 'Commit: %s\nRun: %s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" \
            > app/build/outputs/apk/debug/BUILD_INFO.txt

      - name: Upload AURELIA Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AURELIA-Debug-APK
          path: |
            ${{ env.AURELIA_ROOT }}/app/build/outputs/apk/debug/*.apk
            ${{ env.AURELIA_ROOT }}/app/build/outputs/apk/debug/SHA256SUMS.txt
            ${{ env.AURELIA_ROOT }}/app/build/outputs/apk/debug/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AURELIA-Test-Reports
          path: ${{ env.AURELIA_ROOT }}/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
          
